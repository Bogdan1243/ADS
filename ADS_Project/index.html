<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Flow - Real-Time Music Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .neon-glow-pink { text-shadow: 0 0 10px #f472b6, 0 0 20px #f472b6; }
        .neon-glow-cyan { text-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        .spotlight-animation { animation: pulse 2s infinite ease-in-out; box-shadow: 0 0 40px rgba(244, 114, 182, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        svg { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /**
         * ==========================================
         * DATA STRUCTURES IMPLEMENTATION
         * ==========================================
         */

        class FibonacciHeap {
            constructor() { this.min = null; this.nodeCount = 0; }

            /**
             * Removes a node from the heap by decreasing key to -Infinity and extracting.
             */
            remove(node) {
                this.decreaseKey(node, Number.NEGATIVE_INFINITY);
                this.extractMin();
            }

            insert(artist) {
                const node = { artist, key: artist.priority, degree: 0, parent: null, child: null, left: null, right: null, mark: false };
                node.left = node; node.right = node;
                if (this.min === null) { this.min = node; } else { this.addToRootList(node); if (node.key < this.min.key) this.min = node; }
                this.nodeCount++; return node;
            }

            extractMin() {
                const z = this.min;
                if (z !== null) {
                    if (z.child !== null) {
                        let current = z.child; const children = [];
                        do { children.push(current); current = current.right; } while (current !== z.child);
                        children.forEach(child => { 
                            // Standard Fibonacci Heap: Move children to root list
                            child.parent = null;
                            this.addToRootList(child);
                        });
                    }

                    // Remove z from root list
                    z.left.right = z.right;
                    z.right.left = z.left;

                    if (z === z.right) {
                        // If z was the only root, the new min is one of its promoted children (if any)
                        this.min = z.child;
                    } else {
                        // Otherwise start consolidation from any other root
                        this.min = z.right;
                        this.consolidate();
                    }

                    // Final check: if we have nodes, find the actual minimum
                    if (this.min !== null) {
                        this.consolidate();
                    }

                    this.nodeCount--;
                }
                return z ? z.artist : null;
            }

            decreaseKey(node, newKey) {
                if (newKey > node.key) return;
                node.key = newKey; 
                // We do NOT update node.artist.priority here to avoid corrupting shared object
                const parent = node.parent;
                if (parent !== null && node.key < parent.key) { this.cut(node, parent); this.cascadingCut(parent); }
                if (this.min === null || node.key < this.min.key) this.min = node;
            }

            addToRootList(node) {
                node.left = this.min; node.right = this.min.right;
                this.min.right.left = node; this.min.right = node;
            }
            consolidate() {
                const A = new Array(Math.ceil(Math.log2(this.nodeCount)) + 2).fill(null);
                let rootNodes = []; let current = this.min;
                if (current) { do { rootNodes.push(current); current = current.right; } while (current !== this.min); }
                rootNodes.forEach(w => {
                    let x = w; let d = x.degree;
                    while (A[d] !== null) {
                        let y = A[d]; if (x.key > y.key) [x, y] = [y, x];
                        this.link(y, x); A[d] = null; d++;
                    }
                    A[d] = x;
                });
                this.min = null;
                for (let i = 0; i < A.length; i++) {
                    if (A[i] !== null) {
                        if (this.min === null) { this.min = A[i]; this.min.left = this.min; this.min.right = this.min; }
                        else { this.addToRootList(A[i]); if (A[i].key < this.min.key) this.min = A[i]; }
                    }
                }
            }
            link(y, x) {
                y.left.right = y.right; y.right.left = y.left; y.parent = x;
                if (x.child === null) { x.child = y; y.left = y; y.right = y; }
                else { y.left = x.child; y.right = x.child.right; x.child.right.left = y; x.child.right = y; }
                x.degree++; y.mark = false;
            }
            cut(x, y) {
                if (x === x.right) { y.child = null; }
                else { x.left.right = x.right; x.right.left = x.left; if (y.child === x) y.child = x.right; }
                y.degree--; this.addToRootList(x); x.parent = null; x.mark = false;
            }
            cascadingCut(y) {
                const z = y.parent;
                if (z !== null) { if (!y.mark) { y.mark = true; } else { this.cut(y, z); this.cascadingCut(z); } }
            }
        }

        const RED = 0; const BLACK = 1;
        class RBTNode { constructor(artist, color = RED) { this.artist = artist; this.id = artist.id; this.left = null; this.right = null; this.parent = null; this.color = color; } }
        class RedBlackTree {
            constructor() { this.TNULL = new RBTNode({ id: null }, BLACK); this.root = this.TNULL; }
            insert(artist) {
                let node = new RBTNode(artist); node.left = this.TNULL; node.right = this.TNULL;
                let y = null; let x = this.root;
                while (x !== this.TNULL) { y = x; if (node.id < x.id) x = x.left; else x = x.right; }
                node.parent = y;
                if (y === null) this.root = node; else if (node.id < y.id) y.left = node; else y.right = node;
                if (node.parent === null) { node.color = BLACK; return; }
                if (node.parent.parent === null) return;
                this.fixInsert(node);
            }
            delete(id) { this.deleteNodeHelper(this.root, id); }
            fixInsert(k) {
                let u;
                while (k.parent.color === RED) {
                    if (k.parent === k.parent.parent.right) {
                        u = k.parent.parent.left;
                        if (u.color === RED) { u.color = BLACK; k.parent.color = BLACK; k.parent.parent.color = RED; k = k.parent.parent; }
                        else { if (k === k.parent.left) { k = k.parent; this.rightRotate(k); } k.parent.color = BLACK; k.parent.parent.color = RED; this.leftRotate(k.parent.parent); }
                    } else {
                        u = k.parent.parent.right;
                        if (u.color === RED) { u.color = BLACK; k.parent.color = BLACK; k.parent.parent.color = RED; k = k.parent.parent; }
                        else { if (k === k.parent.right) { k = k.parent; this.leftRotate(k); } k.parent.color = BLACK; k.parent.parent.color = RED; this.rightRotate(k.parent.parent); }
                    }
                    if (k === this.root) break;
                }
                this.root.color = BLACK;
            }
            leftRotate(x) {
                let y = x.right; x.right = y.left;
                if (y.left !== this.TNULL) y.left.parent = x;
                y.parent = x.parent;
                if (x.parent === null) this.root = y; else if (x === x.parent.left) x.parent.left = y; else x.parent.right = y;
                y.left = x; x.parent = y;
            }
            rightRotate(x) {
                let y = x.left; x.left = y.right;
                if (y.right !== this.TNULL) y.right.parent = x;
                y.parent = x.parent;
                if (x.parent === null) this.root = y; else if (x === x.parent.right) x.parent.right = y; else x.parent.left = y;
                y.right = x; x.parent = y;
            }
            deleteNodeHelper(node, key) {
                let z = this.TNULL; let x, y;
                while (node !== this.TNULL) { if (node.id === key) z = node; if (node.id <= key) node = node.right; else node = node.left; }
                if (z === this.TNULL) return;
                y = z; let yOriginalColor = y.color;
                if (z.left === this.TNULL) { x = z.right; this.rbTransplant(z, z.right); }
                else if (z.right === this.TNULL) { x = z.left; this.rbTransplant(z, z.left); }
                else {
                    y = this.minimum(z.right); yOriginalColor = y.color; x = y.right;
                    if (y.parent === z) { x.parent = y; } else { this.rbTransplant(y, y.right); y.right = z.right; y.right.parent = y; }
                    this.rbTransplant(z, y); y.left = z.left; y.left.parent = y; y.color = z.color;
                }
                if (yOriginalColor === BLACK) this.fixDelete(x);
            }
            fixDelete(x) {
                let s;
                while (x !== this.root && x.color === BLACK) {
                    if (x === x.parent.left) {
                        s = x.parent.right;
                        if (s.color === RED) { s.color = BLACK; x.parent.color = RED; this.leftRotate(x.parent); s = x.parent.right; }
                        if (s.left.color === BLACK && s.right.color === BLACK) { s.color = RED; x = x.parent; }
                        else { if (s.right.color === BLACK) { s.left.color = BLACK; s.color = RED; this.rightRotate(s); s = x.parent.right; } s.color = x.parent.color; x.parent.color = BLACK; s.right.color = BLACK; this.leftRotate(x.parent); x = this.root; }
                    } else {
                        s = x.parent.left;
                        if (s.color === RED) { s.color = BLACK; x.parent.color = RED; this.rightRotate(x.parent); s = x.parent.left; }
                        if (s.right.color === BLACK && s.left.color === BLACK) { s.color = RED; x = x.parent; }
                        else { if (s.left.color === BLACK) { s.right.color = BLACK; s.color = RED; this.leftRotate(s); s = x.parent.left; } s.color = x.parent.color; x.parent.color = BLACK; s.left.color = BLACK; this.rightRotate(x.parent); x = this.root; }
                    }
                }
                x.color = BLACK;
            }
            rbTransplant(u, v) { if (u.parent === null) this.root = v; else if (u === u.parent.left) u.parent.left = v; else u.parent.right = v; v.parent = u.parent; }
            minimum(node) { while (node.left !== this.TNULL) node = node.left; return node; }
        }

        class DisjointSet {
            constructor() { this.parent = {}; this.rank = {}; }
            makeSet(id) { this.parent[id] = id; this.rank[id] = 0; }
            find(id) { if (this.parent[id] === id) return id; return this.parent[id] = this.find(this.parent[id]); }
            union(id1, id2) {
                let r1 = this.find(id1); let r2 = this.find(id2);
                if (r1 !== r2) { if (this.rank[r1] < this.rank[r2]) this.parent[r1] = r2; else if (this.rank[r1] > this.rank[r2]) this.parent[r2] = r1; else { this.parent[r2] = r1; this.rank[r1]++; } }
            }
        }

        /**
         * ==========================================
         * REACT UI COMPONENTS
         * ==========================================
         */

        const { useState, useEffect, useMemo, useRef } = React;
        const STAGES = ["Main Stage", "Electronic", "Acoustic", "Emerging"];
        const STAGE_COLORS = { "Main Stage": "pink-500", "Electronic": "cyan-400", "Acoustic": "yellow-400", "Emerging": "green-400" };
        const PRIORITY_COLORS = (p) => p <= 3 ? "rose-500" : (p <= 6 ? "orange-500" : "blue-500");
        const SAMPLE_DATA = [
            { id: 1, name: "The Midnight", genre: "Synthwave", priority: 2, stage: "Electronic", hometown: "Los Angeles" },
            { id: 2, name: "Novo Amor", genre: "Indie Folk", priority: 6, stage: "Acoustic", hometown: "Wales" },
            { id: 3, name: "Bicep", genre: "Electronic", priority: 1, stage: "Main Stage", hometown: "Belfast" },
            { id: 4, name: "Wet Leg", genre: "Indie Rock", priority: 4, stage: "Emerging", hometown: "Isle of Wight" },
            { id: 5, name: "Bonobo", genre: "Jazz/Electronic", priority: 3, stage: "Main Stage", hometown: "Brighton" },
            { id: 6, name: "Aurora", genre: "Art Pop", priority: 5, stage: "Acoustic", hometown: "Norway" }
        ];

        let artistCounter = 100;

        function App() {
            const [artists, setArtists] = useState(SAMPLE_DATA);
            const [nextArtist, setNextArtist] = useState(null);
            const [heapNodes, setHeapNodes] = useState({});
            const [tick, setTick] = useState(0);

            const heap = useMemo(() => new FibonacciHeap(), []);
            const rbt = useMemo(() => new RedBlackTree(), []);
            const dsu = useMemo(() => new DisjointSet(), []);

            useEffect(() => {
                const nodes = {};
                SAMPLE_DATA.forEach(a => { nodes[a.id] = heap.insert(a); rbt.insert(a); dsu.makeSet(a.id); });
                setHeapNodes(nodes); setTick(t => t + 1);
            }, []);

            const addArtist = (a) => {
                const newA = { ...a, id: artistCounter++ };
                const node = heap.insert(newA); rbt.insert(newA); dsu.makeSet(newA.id);
                setArtists(prev => [...prev, newA]);
                setHeapNodes(prev => ({ ...prev, [newA.id]: node }));
                setTick(t => t + 1);
            };

            const handleExtractMin = () => {
                const a = heap.extractMin();
                if (a) {
                    setNextArtist(a); rbt.delete(a.id);
                    setArtists(prev => prev.filter(x => x.id !== a.id));
                    setHeapNodes(prev => {
                        const newNodes = { ...prev };
                        delete newNodes[a.id];
                        return newNodes;
                    });
                    setTick(t => t + 1);
                    setTimeout(() => setNextArtist(null), 4000);
                }
            };

            const handlePromote = (id, p) => {
                const node = heapNodes[id];
                if (node) {
                    const artist = node.artist;
                    artist.priority = p;

                    if (p < node.key) {
                        heap.decreaseKey(node, p);
                    } else if (p > node.key) {
                        heap.remove(node);
                        const newNode = heap.insert(artist);
                        setHeapNodes(prev => ({ ...prev, [id]: newNode }));
                    }
                    
                    setArtists(prev => prev.map(x => x.id === id ? { ...x, priority: p } : x));
                    setTick(t => t + 1);
                }
            };


            const headliner = [...artists].sort((a, b) => a.priority - b.priority)[0];

            return (
                <div className="p-4 md:p-6 max-w-[1600px] mx-auto space-y-6">
                    <header className="flex justify-between items-end border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-4xl font-black neon-glow-pink text-pink-500 italic tracking-tighter">FESTIVAL FLOW</h1>
                            <p className="text-[10px] text-slate-500 uppercase tracking-[0.3em]">Real-Time Data Structure Visualizer</p>
                        </div>
                        <div className="flex space-x-12">
                            <div className="text-right">
                                <span className="text-[10px] text-slate-500 block uppercase">Artists Active</span>
                                <span className="text-2xl font-bold text-cyan-400">{artists.length}</span>
                            </div>
                            <div className="text-right border-l border-slate-800 pl-8">
                                <span className="text-[10px] text-slate-500 block uppercase">Next up</span>
                                <span className="text-lg font-bold text-white truncate max-w-[150px] block">{headliner ? headliner.name : '---'}</span>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 xl:grid-cols-4 gap-6">
                        {/* Control Panel */}
                        <div className="xl:col-span-1 space-y-6">
                            <section className="bg-slate-900/50 p-5 rounded-2xl border border-slate-800 shadow-xl">
                                <h2 className="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Add New Artist</h2>
                                <AddArtistForm onAdd={addArtist} />
                            </section>
                            
                            <section className="bg-slate-900/50 p-5 rounded-2xl border border-slate-800 shadow-xl">
                                <h2 className="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Call Next Artist</h2>
                                <div className="text-center py-2">
                                    {!nextArtist ? (
                                        <button onClick={handleExtractMin} className="bg-white text-black font-black text-xs px-8 py-4 rounded-full uppercase tracking-widest hover:scale-105 transition-all shadow-white/10 shadow-xl">Call Next Artist</button>
                                    ) : (
                                        <div className="spotlight-animation bg-slate-950 border border-pink-500/50 p-4 rounded-xl">
                                            <div className="text-[8px] text-pink-500 font-bold uppercase mb-1">Performing Now</div>
                                            <h3 className="text-xl font-black italic text-white uppercase neon-glow-pink">{nextArtist.name}</h3>
                                        </div>
                                    )}
                                </div>
                            </section>
                        </div>

                        {/* Promotion Panel */}
                        <div className="xl:col-span-2 bg-slate-900/50 p-5 rounded-2xl border border-slate-800 shadow-xl flex flex-col">
                            <h2 className="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Promote Artists (DecreaseKey)</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 overflow-y-auto max-h-[400px] custom-scrollbar pr-2">
                                {artists.map(a => (
                                    <div key={a.id} className="bg-slate-950/50 p-3 rounded-xl border border-slate-800/50 flex flex-col space-y-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-white uppercase truncate">{a.name}</span>
                                            <span className="text-[10px] text-slate-500">Slot #{a.priority}</span>
                                        </div>
                                        <div className="flex items-center space-x-3">
                                            <input type="range" min="1" max="10" value={a.priority} onChange={e => handlePromote(a.id, parseInt(e.target.value))} className="flex-grow h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500" />
                                            <span className="text-[10px] text-cyan-400 font-bold">Promote</span>
                                        </div>
                                    </div>
                                ))}
                                {artists.length === 0 && <div className="col-span-2 text-center text-slate-700 py-10 italic">No artists in lineup...</div>}
                            </div>
                        </div>

                        {/* Summary Panel */}
                        <div className="xl:col-span-1 bg-slate-900/50 p-5 rounded-2xl border border-pink-500/10 shadow-xl">
                            <h2 className="text-xs font-bold text-pink-500 uppercase mb-4 tracking-widest">Stage Groups</h2>
                            <div className="space-y-4">
                                {STAGES.map(s => (
                                    <div key={s}>
                                        <div className="flex justify-between text-[10px] mb-1">
                                            <span className={`text-${STAGE_COLORS[s]} font-bold`}>{s.toUpperCase()}</span>
                                            <span className="text-slate-500">{artists.filter(a => a.stage === s).length}</span>
                                        </div>
                                        <div className="flex flex-wrap gap-1">
                                            {artists.filter(a => a.stage === s).map(a => (
                                                <div key={a.id} className="bg-slate-950 border border-slate-800 px-1.5 py-0.5 rounded text-[8px] text-slate-300">{a.name}</div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Visualizer Row */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6" key={tick}>
                        <div className="bg-slate-900/30 p-5 rounded-2xl border border-slate-800">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-sm font-bold text-cyan-400 tracking-widest uppercase">Fibonacci Heap (Performance Queue)</h2>
                                <span className="text-[9px] text-slate-500 italic uppercase">Min-Priority Forest • Root List + Subtrees</span>
                            </div>
                            <div className="bg-black/40 rounded-xl h-[400px] border border-slate-800/50 overflow-hidden">
                                <HeapVisualizer heap={heap} />
                            </div>
                        </div>

                        <div className="bg-slate-900/30 p-5 rounded-2xl border border-slate-800">
                             <div className="flex justify-between items-center mb-4">
                                <h2 className="text-sm font-bold text-rose-500 tracking-widest uppercase">Red-Black Tree (Artist Registry)</h2>
                                <span className="text-[9px] text-slate-500 italic uppercase">Self-Balancing BST • ID Indexed</span>
                            </div>
                            <div className="bg-black/40 rounded-xl h-[400px] border border-slate-800/50 overflow-hidden">
                                <RBTVisualizer rbt={rbt} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AddArtistForm({ onAdd }) {
            const [data, setData] = useState({ name: '', genre: '', priority: 5, stage: 'Main Stage' });
            return (
                <form onSubmit={e => { e.preventDefault(); onAdd(data); setData({ name: '', genre: '', priority: 5, stage: 'Main Stage' }); }} className="space-y-3">
                    <input required placeholder="Artist Name" value={data.name} onChange={e => setData({...data, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:border-pink-500 outline-none" />
                    <input required placeholder="Genre" value={data.genre} onChange={e => setData({...data, genre: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:border-pink-500 outline-none" />
                    <select value={data.stage} onChange={e => setData({...data, stage: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white outline-none">
                        {STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                    <div className="flex items-center space-x-3">
                        <span className="text-[10px] text-slate-500 uppercase">Slot</span>
                        <input type="range" min="1" max="10" value={data.priority} onChange={e => setData({...data, priority: parseInt(e.target.value)})} className="flex-grow h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-pink-500" />
                        <span className="text-xs font-bold text-pink-500 w-4">{data.priority}</span>
                    </div>
                    <button type="submit" className="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-3 text-[10px] rounded-xl transition-all shadow-lg">ADD TO FESTIVAL</button>
                </form>
            );
        }

        function HeapVisualizer({ heap }) {
            const roots = []; if (heap.min) { let c = heap.min; do { roots.push(c); c = c.right; } while (c !== heap.min); }
            const renderNode = (node, x, y, spacing) => {
                const els = [];
                els.push(<circle key={`h-${node.artist.id}`} cx={x} cy={y} r="18" fill="#020617" stroke={node.mark ? "#f472b6" : "#22d3ee"} strokeWidth="2" />);
                els.push(<text key={`ht-${node.artist.id}`} x={x} y={y+4} textAnchor="middle" fontSize="10" fill="white" fontWeight="bold">#{node.key}</text>);
                if (node.child) {
                    let child = node.child; const children = []; do { children.push(child); child = child.right; } while (child !== node.child);
                    const childY = y + 70; const totalW = (children.length - 1) * spacing; let startX = x - totalW / 2;
                    children.forEach((c, i) => {
                        const cx = startX + i * spacing;
                        els.push(<line key={`hl-${c.artist.id}`} x1={x} y1={y+18} x2={cx} y2={childY-18} stroke="#1e293b" strokeWidth="1" />);
                        els.push(...renderNode(c, cx, childY, spacing * 0.5));
                    });
                }
                return els;
            };
            return (
                <svg width="100%" height="100%" viewBox="0 0 1000 400">
                    {roots.map((r, i) => <g key={`rg-${i}`}>{renderNode(r, 100 + i * 160, 60, 100)}</g>)}
                </svg>
            );
        }

        function RBTVisualizer({ rbt }) {
            const renderNode = (node, x, y, xOffset) => {
                if (node === rbt.TNULL || !node) return null;
                const els = []; const childY = y + 70;
                if (node.left !== rbt.TNULL) { els.push(<line key={`rl-${node.id}`} x1={x} y1={y} x2={x - xOffset} y2={childY} stroke="#1e293b" strokeWidth="1" />); els.push(...renderNode(node.left, x - xOffset, childY, xOffset / 1.8)); }
                if (node.right !== rbt.TNULL) { els.push(<line key={`rr-${node.id}`} x1={x} y1={y} x2={x + xOffset} y2={childY} stroke="#1e293b" strokeWidth="1" />); els.push(...renderNode(node.right, x + xOffset, childY, xOffset / 1.8)); }
                els.push(<g key={`rg-${node.id}`}><circle cx={x} cy={y} r="18" fill={node.color === RED ? "#ef4444" : "#020617"} stroke="#475569" strokeWidth="2" /><text x={x} y={y-2} textAnchor="middle" fontSize="7" fill="white" className="font-bold">{node.artist.name.substring(0, 4)}</text><text x={x} y={y+8} textAnchor="middle" fontSize="8" fill={node.color === RED ? "white" : "#ef4444"} className="font-black">#{node.artist.priority}</text></g>);
                return els;
            };
            return (
                <svg width="100%" height="100%" viewBox="0 0 1000 400">
                    <g transform="translate(0, 40)">{renderNode(rbt.root, 500, 30, 220)}</g>
                </svg>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
